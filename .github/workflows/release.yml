name: Release

# Builds release binaries for falcon, falcon-lsp, and falcon-mcp on tag push.
# Triggered on annotated/lightweight tags of the form vX.Y.Z (e.g. v0.4.0).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            package_os: macos
            package_arch: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            package_os: macos
            package_arch: x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            package_os: linux
            package_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          version="${ref#v}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=falcon-${version}-${{ matrix.package_os }}-${{ matrix.package_arch }}" >> "$GITHUB_OUTPUT"
          echo "archive=falcon-${version}-${{ matrix.package_os }}-${{ matrix.package_arch }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Verify binary versions match tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          bin_dir="target/${{ matrix.target }}/release"
          for bin in falcon falcon-lsp falcon-mcp; do
            actual="$("${bin_dir}/${bin}" --version | awk '{print $NF}')"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${bin} reports version ${actual}, expected ${expected}"
              exit 1
            fi
          done

      - name: Detect macOS notarization secrets
        id: notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERT_P12}" ] &&
             [ -n "${APPLE_CERT_PASSWORD}" ] &&
             [ -n "${APPLE_ID}" ] &&
             [ -n "${APPLE_TEAM_ID}" ] &&
             [ -n "${APPLE_APP_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping macOS notarization; Apple signing secrets are not fully configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.notarization.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/falcon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert_path="${RUNNER_TEMP}/falcon-signing.p12"

          echo "${APPLE_CERT_P12}" | base64 --decode > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERT_PASSWORD}" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          echo "FALCON_KEYCHAIN_PATH=${keychain_path}" >> "$GITHUB_ENV"

      - name: Sign macOS binaries
        if: runner.os == 'macOS' && steps.notarization.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          identity="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "${identity}" ]; then
            identity="$(security find-identity -v -p codesigning "${FALCON_KEYCHAIN_PATH}" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "${identity}" ]; then
            echo "::error::No Developer ID Application signing identity found."
            exit 1
          fi

          bin_dir="target/${{ matrix.target }}/release"
          for bin in falcon falcon-lsp falcon-mcp; do
            codesign --force \
              --options runtime \
              --timestamp \
              --sign "${identity}" \
              "${bin_dir}/${bin}"
            codesign --verify --strict --verbose=2 "${bin_dir}/${bin}"
          done

      - name: Notarize macOS binaries
        if: runner.os == 'macOS' && steps.notarization.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bin_dir="target/${target}/release"
          notary_dir="${RUNNER_TEMP}/falcon-notary-${target}"
          notary_zip="${RUNNER_TEMP}/falcon-notary-${target}.zip"
          mkdir -p "${notary_dir}"
          cp "${bin_dir}/falcon" "${notary_dir}/"
          cp "${bin_dir}/falcon-lsp" "${notary_dir}/"
          cp "${bin_dir}/falcon-mcp" "${notary_dir}/"
          ditto -c -k --keepParent "${notary_dir}" "${notary_zip}"

          xcrun notarytool submit "${notary_zip}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait

      - name: Delete signing keychain
        if: always() && runner.os == 'macOS' && steps.notarization.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -n "${FALCON_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${FALCON_KEYCHAIN_PATH}" || true
          fi

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          package="${{ steps.version.outputs.package }}"
          archive="${{ steps.version.outputs.archive }}"

          staging="${package}"
          mkdir -p "${staging}"

          bin_dir="target/${target}/release"
          cp "${bin_dir}/falcon"     "${staging}/"
          cp "${bin_dir}/falcon-lsp" "${staging}/"
          cp "${bin_dir}/falcon-mcp" "${staging}/"

          # Include README and LICENSE-style files if present (best effort).
          [ -f README.md ]   && cp README.md   "${staging}/" || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "${staging}/" || true
          [ -f LICENSE ]     && cp LICENSE     "${staging}/" || true

          tar -czf "${archive}" "${staging}"
          ls -la "${archive}"

          # Compute SHA256 for the archive.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: falcon-${{ steps.version.outputs.version }}-${{ matrix.package_os }}-${{ matrix.package_arch }}
          path: |
            ${{ steps.version.outputs.archive }}
            ${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          version="${ref#v}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets and compute combined SHA256SUMS
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten artifact directories — each artifact dir contains the archive
          # plus its per-file .sha256 sidecar; we only ship the archives + a
          # single combined SHA256SUMS.
          find artifacts -type f -name 'falcon-*.tar.gz' -exec cp {} dist/ \;
          ls -la dist

          expected=(
            "falcon-${{ steps.version.outputs.version }}-macos-arm64.tar.gz"
            "falcon-${{ steps.version.outputs.version }}-macos-x64.tar.gz"
            "falcon-${{ steps.version.outputs.version }}-linux-x64.tar.gz"
          )
          for archive in "${expected[@]}"; do
            if [ ! -f "dist/${archive}" ]; then
              echo "::error::Missing expected release archive: ${archive}"
              exit 1
            fi
          done

          archive_count="$(find dist -maxdepth 1 -type f -name 'falcon-*.tar.gz' | wc -l | tr -d ' ')"
          if [ "${archive_count}" != "3" ]; then
            echo "::error::Expected exactly 3 release archives, found ${archive_count}"
            find dist -maxdepth 1 -type f -name 'falcon-*.tar.gz' -print
            exit 1
          fi

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum falcon-*.tar.gz > SHA256SUMS
          else
            shasum -a 256 falcon-*.tar.gz > SHA256SUMS
          fi
          checksum_count="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "${checksum_count}" != "3" ]; then
            echo "::error::Expected exactly 3 SHA256SUMS entries, found ${checksum_count}"
            exit 1
          fi
          cat SHA256SUMS

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/falcon-*.tar.gz
            dist/SHA256SUMS

  npm:
    name: Publish npm Package
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/falcon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"
          expected="${ref#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::npm package version ${actual} does not match tag ${expected}"
            exit 1
          fi

      - name: Test npm package
        run: npm test

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout Falcon
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          version="${ref#v}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check Homebrew tap config
        id: tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          repository="${HOMEBREW_TAP_REPOSITORY:-falcon-lint/homebrew-tap}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::notice::Skipping Homebrew tap update; HOMEBREW_TAP_TOKEN is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release checksums
        if: steps.tap.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/SHA256SUMS" \
            -o SHA256SUMS
          cat SHA256SUMS

      - name: Checkout Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.tap.outputs.repository }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: steps.tap.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/update_homebrew_formula.sh \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --checksums SHA256SUMS \
            --tap-dir homebrew-tap

      - name: Commit and push formula
        if: steps.tap.outputs.enabled == 'true'
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/falcon.rb; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git add Formula/falcon.rb
          git commit -m "Update falcon to ${{ steps.version.outputs.tag }}"
          git push
