[package]
name = "falcon-flutter"
version = "0.5.2"
edition = "2021"
description = "Rust-powered static analysis CLI for Flutter/Dart"
license = "MIT"
repository = "https://github.com/viveky259259/falcon"
keywords = ["dart", "flutter", "linter", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/src/**/*.rs",
    "/tests/**",
    "/benches/**/*.rs",
    "/docs/**",
]

[[bin]]
name = "falcon"
path = "src/main.rs"

[[bin]]
name = "falcon-lsp"
path = "src/lsp_main.rs"

[[bin]]
name = "falcon-mcp"
path = "src/mcp_main.rs"

[lib]
name = "falcon"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-dart = "0.1"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
colored = "2"
walkdir = "2"
glob = "0.3"
anyhow = "1"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
percent-encoding = "2"
candle-core = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }
dirs = { version = "5", optional = true }

[features]
default = []
ai-local = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:dirs"]

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
jsonschema = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
